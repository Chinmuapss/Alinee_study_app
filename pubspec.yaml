name: ibantay
description: iBantay - A Mobile Application for Real-Time Community Incident Reporting.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.3
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
